<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모여봐요 채움의숲 · 나만의 AI아일랜드 룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--sky1:#bfe8f5;--sky2:#eaf8e2;--grass:#9bd673;--grass2:#74bd55;--wood:#b9824a;--wood2:#8a5a2b;--cream:#fff6dc;--ink:#5a3d1e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2b4a6b;--sky2:#3d6a5a;--grass:#5a9a4c;--grass2:#478a40;--cream:#f3e7c3}}
:root[data-theme="dark"]{--sky1:#2b4a6b;--sky2:#3d6a5a;--grass:#5a9a4c;--grass2:#478a40;--cream:#f3e7c3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;background:linear-gradient(#86d0ee,#d7f1f1 55%,#fdf3c8 72%)}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.cl{animation:drift 45s ease-in-out infinite alternate}.cl2{animation-duration:60s;animation-direction:alternate-reverse}
.bl{animation:bob 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(160px)}}@keyframes bob{to{transform:translateY(-16px)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;padding:2.5vmin;--b:min(100vw - 5vmin,100vh - 36vmin)}
.side{width:min(100vw - 5vmin,165vmin);flex:none;min-width:0;display:flex;flex-direction:row;align-items:stretch;gap:2vmin}
.sign{flex:none;display:flex;align-items:center;gap:2vmin;background:var(--wood);border:.7vmin solid var(--wood2);border-radius:3vmin;padding:1.4vmin 2.4vmin;text-align:left;color:var(--cream);box-shadow:0 .8vmin 0 var(--wood2);cursor:default}
.sign svg{width:8vmin;height:8vmin}
h1{margin:0;font-weight:400;font-size:4vmin;line-height:1.15}
h2{margin:.5vmin 0 0;font-weight:400;font-size:2.9vmin;color:#ffe9a8}
.sign p{margin:.5vmin 0 0;font-size:2vmin;opacity:.92}
.sign p.lg{display:block;margin:.7vmin 0 0;opacity:1}
.lg img{display:block;height:4vmin;width:auto;background:var(--cream);border-radius:1.2vmin;padding:.5vmin 1.2vmin}
.pane{background:var(--cream);border:.5vmin dashed var(--wood);border-radius:3vmin;padding:1.4vmin 2vmin}
.stat{display:none}
.top{white-space:nowrap;display:flex;justify-content:space-between;align-items:baseline;font-size:2.8vmin}
.top b{font-weight:400;font-size:4.2vmin}
.bar{height:2vmin;border-radius:2vmin;background:#e4d6a8;margin-top:1.2vmin;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grass2);border-radius:2vmin;transition:width .4s}
.legend{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,1fr);gap:1vmin}
.row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vmin;font-size:2.1vmin;line-height:1.15;text-align:center}
.row i{width:2.6vmin;height:2.6vmin;border-radius:50% 10% 50% 10%;background:var(--c)}
.note{grid-column:1/-1;text-align:center;font-size:1.8vmin;line-height:1;color:#c8483c}
.row b{font-weight:400;word-break:keep-all}.row .g{width:88%;height:1.5vmin;border-radius:1vmin;background:#e4d6a8;overflow:hidden}
.row .g span{display:block;height:100%;background:var(--c);border-radius:1vmin;box-shadow:inset 0 0 0 .2vmin rgba(90,61,30,.35);transition:width .4s}
.row em{font-style:normal;font-size:2.4vmin;line-height:1}
.hint{flex:none;text-align:center;font-size:2.2vmin;color:var(--ink);opacity:.9}
.board{width:var(--b);flex:none;display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:calc(var(--b)*.01);padding:calc(var(--b)*.018);background:var(--wood);border:calc(var(--b)*.01) solid var(--wood2);border-radius:calc(var(--b)*.03);box-shadow:0 calc(var(--b)*.008) 0 var(--wood2)}
.cell{aspect-ratio:1/1;min-width:0;border:0;padding:0;cursor:pointer;font:inherit;font-size:calc(var(--b)*.0135);line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);border-radius:50% 10% 50% 10%;
background:radial-gradient(circle at 76% 24%,#fffd 0 3.5%,transparent 4.5%),linear-gradient(135deg,transparent 47%,#fff6 48% 52%,transparent 53%),linear-gradient(160deg,#aee684,#5fb34a);
box-shadow:0 calc(var(--b)*.003) 0 #3e8a3a;transition:transform .12s}
.cell:active{transform:translateY(3px) scale(.95)}
.cell:focus-visible{outline:3px solid #fff}
.cell.open{cursor:default;color:var(--ink);text-shadow:none;background:var(--c);box-shadow:inset 0 3px 0 rgba(0,0,0,.14);font-size:calc(var(--b)*.0125)}
.cell.open:active{transform:none}
.t1{--c:#ffc83d}.t2{--c:#ff9eb5}.t3{--c:#7ccbf2}.t4{--c:#a6e58f}.t5{--c:#f4e8c4}
.done{grid-column:1/-1;aspect-ratio:25/10;display:grid;place-items:center;text-align:center;color:var(--cream);font-size:calc(var(--b)*.05);line-height:1.5}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(40,80,50,.62);z-index:20;overflow:hidden}
.ov.on{display:grid}
.card{background:var(--cream);border:.8vmin dashed var(--wood);outline:1.4vmin solid var(--cream);border-radius:5vmin;padding:5vmin 9vmin;text-align:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1);position:relative;z-index:2}
.badge{width:36vmin;height:36vmin;margin:0 auto;display:grid;place-items:center;border-radius:50% 10% 50% 10%;background:var(--c);font-size:13vmin;box-shadow:0 1vmin 0 rgba(0,0,0,.15)}
.msg{font-size:5.4vmin;margin-top:3vmin}.sub{font-size:2.8vmin;margin-top:1.4vmin;opacity:.75}
.fall{position:absolute;top:-8vmin;font-size:5vmin;animation:fall linear forwards;z-index:1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.box{background:var(--cream);border:.5vmin dashed var(--wood);border-radius:24px;padding:24px;width:min(92vw,560px);font-size:18px}
.box h3{margin:0 0 12px;font-weight:400;font-size:26px}
.box input{font:inherit;font-size:22px;width:100%;padding:10px 14px;border-radius:14px;border:3px solid var(--wood);background:#fff;color:var(--ink)}
.box table{width:100%;border-collapse:collapse;margin:10px 0 16px}
.box td,.box th{padding:5px 8px;text-align:center;font-weight:400;border-bottom:1px dashed var(--wood)}
.box button{font:inherit;font-size:20px;border:0;border-radius:16px;padding:12px 16px;margin:4px 4px 0 0;background:var(--grass2);color:#fff;cursor:pointer}
.box button.warn{background:#d9684a}.box button.gray{background:var(--wood)}.box button.armed{background:#b3261e}
.err{color:#b3261e;min-height:1.4em;margin-top:6px}
.hop{animation:hop 1.8s ease-in-out infinite alternate}.h2{animation-delay:-.9s}
.bf{animation:flit 7s ease-in-out infinite alternate}.b2{animation-duration:9s}
@keyframes hop{to{transform:translateY(-8px)}}@keyframes flit{to{transform:translate(50px,-26px)}}
.peek{position:fixed;bottom:0;width:12vmin;height:auto;z-index:2;pointer-events:none}.pl{left:1.2vmin}.pr{right:1.2vmin}
.wheel{position:relative;width:var(--b);height:var(--b);flex:none}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
#disc{transform-origin:110px 110px;transition:transform 5.6s cubic-bezier(.12,.62,.12,1)}
.w{fill:var(--c);stroke:var(--c);stroke-width:.3}.w.u{fill:#d9d0b4;stroke:#d9d0b4;opacity:.45}
.go{position:absolute;left:50%;top:50%;width:24%;height:24%;transform:translate(-50%,-50%);border-radius:50%;border:calc(var(--b)*.012) solid var(--wood2);background:linear-gradient(#ffe08a,#ffb83d);color:var(--ink);font:inherit;font-size:calc(var(--b)*.042);cursor:pointer;box-shadow:0 calc(var(--b)*.01) 0 var(--wood2)}
.go:active:not(:disabled){transform:translate(-50%,calc(-50% + 3px))}.go:disabled{opacity:.75;cursor:default}
@media (prefers-reduced-motion:reduce){#disc{transition-duration:1s}}
.cw.t1{fill:#ffe9a8}.cw.t2{fill:#ffd3de}.cw.t3{fill:#cdeaf9}.cw.t4{fill:#d9f3cc}.cw.t5{fill:#f8f0d6}.cw{stroke:#fff;stroke-width:1.2}
.cg.u{opacity:.4;filter:grayscale(1)}.cg text{font-family:inherit;fill:var(--ink);text-anchor:middle}
.row img{width:6.5vmin;height:6.5vmin;border-radius:1.2vmin;object-fit:cover;box-shadow:0 0 0 .3vmin var(--c)}
.badge img{width:78%;height:78%;object-fit:contain;border-radius:12%}
.end{position:absolute;inset:3%;border-radius:50%;display:grid;place-items:center;text-align:center;background:rgba(255,246,220,.95);border:calc(var(--b)*.012) dashed var(--wood);pointer-events:none;z-index:3}.end[hidden]{display:none}
.end b{display:block;font-weight:400;font-size:calc(var(--b)*.1);line-height:1.1;color:#c8483c}.end span{display:block;margin-top:calc(var(--b)*.02);font-size:calc(var(--b)*.035)}
@media (orientation:portrait){
.side{flex-direction:column;gap:1.6vmin}
.stat{width:auto}
.sign{justify-content:center}.hint{display:none}
}
@media (prefers-reduced-motion:reduce){.card,.fall,.cl,.bl,.hop,.bf{animation:none}.fall{display:none}}
</style>
</head>

const START=[...Array(10)].map((_,k)=>W.slice(0,k%5).reduce((a,b)=>a+b,0)+(k>=5?180:0));
const P=(a,r)=>[(110+r*Math.sin(a*Math.PI/180)).toFixed(2),(110-r*Math.cos(a*Math.PI/180)).toFixed(2)];
function cell(k,off){
  const t=k%5+1,w=W[t-1],a0=START[k],a1=a0+w,[x0,y0]=P(a0,94),[x1,y1]=P(a1,94);
  return `<g class="cg${off[t]?" u":""}"><path class="cw t${t}" d="M110 110L${x0} ${y0}A94 94 0 0 1 ${x1} ${y1}Z"/><g transform="rotate(${a0+w/2} 110 110)"><text x="110" y="50" font-size="${7+t}" style="fill:${DK[t]};stroke:#fff;stroke-width:.7;paint-order:stroke">${t}등</text></g></g>`;
}
function render(){
  const cnt=[0,0,0,0,0,0];S.board.forEach((t,i)=>{if(!S.open[i])cnt[t]++});
  const left=cnt.reduce((a,b)=>a+b,0),off=cnt.map(c=>!c);
  $("#disc").innerHTML=[...Array(10)].map((_,k)=>cell(k,off)).join("");
  const e=$("#end");e.hidden=left>0;e.innerHTML=`<div><b>${S.round}회차 종료</b><span>참여해 주셔서 감사합니다</span></div>`;
  $(".hint").textContent=left?"가운데 버튼을 눌러 룰렛을 돌려보세요":"준비한 경품을 모두 나눠드렸어요";
  $("#go").disabled=busy||!left;$("#go").textContent=left?"돌려라!":"끝!";
  $("#legend").innerHTML=[1,2,3,4,5].map(t=>`<div class="row t${t}"><img src="${IMG[t]}" alt=""><b>${t}등 ${NAME[t]}</b></div>`).join("")+'<div class="note">*상품은 변경될 수 있습니다.</div>';
}

/* 남은 경품 한 개를 같은 확률로 뽑아 등수를 정하므로, 등수별 확률은 남은 수량 비율과 같아요. 그 등수 칸(2곳) 중 한 곳에서 룰렛이 멈춰요 */
function spin(){
  if(busy)return;
  const free=[];S.open.forEach((o,i)=>{if(!o)free.push(i)});if(!free.length)return;
  const i=free[rnd(free.length)],t=S.board[i],k=t-1+5*rnd(2),c=START[k]+W[t-1]*(.2+rnd(60)/100);
  busy=true;$("#go").disabled=true;
  rot+=360*5+((((-c-rot)%360)+360)%360);
  $("#disc").style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{S.open[i]=true;save();busy=false;render();show(t)},5800);
}
function show(t){
  lock=true;setTimeout(()=>lock=false,700);
  $("#card").className="card t"+t;
  $("#card").innerHTML=`<div class="badge"><img src="${IMG[t]}" alt=""></div><div class="msg">${t}등 ${t<=3?"축하해요! ":""}${NAME[t]} 당첨!</div><div class="sub">화면을 톡 누르면 닫혀요</div>`;
  $("#ov").classList.add("on");confetti(t);
}
$("#go").onclick=spin;
$("#ov").onclick=()=>{if(lock)return;$("#ov").classList.remove("on");document.querySelectorAll(".fall").forEach(e=>e.remove())};
$("#lights").innerHTML=Array.from({length:30},(_,k)=>{const a=k*12*Math.PI/180;return `<circle cx="${(110+100*Math.sin(a)).toFixed(1)}" cy="${(110-100*Math.cos(a)).toFixed(1)}" r="1.9" fill="#fff6dc"/>`}).join("");

function confetti(t){
  const ic=["🍃","🌿","✨","🍀"],n=t===1?44:t<=3?28:14,ov=$("#ov");
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fall";s.textContent=ic[rnd(ic.length)];
    s.style.left=rnd(100)+"%";s.style.animationDuration=(2.4+rnd(24)/10)+"s";s.style.animationDelay=(rnd(14)/10)+"s";ov.appendChild(s)}
}

/* 관리자: 제목 간판을 1.5초 길게 누르기 */
let lp;const sg=$("#sign");
sg.addEventListener("pointerdown",()=>{lp=setTimeout(openAdmin,1500)});
["pointerup","pointerleave","pointercancel"].forEach(e=>sg.addEventListener(e,()=>clearTimeout(lp)));
document.addEventListener("contextmenu",e=>e.preventDefault());

function openAdmin(){
  $("#box").innerHTML='<h3>관리자 확인</h3><input id="pin" type="password" inputmode="numeric" placeholder="비밀번호 입력" autocomplete="off"><div class="err" id="err"></div><button id="ok">확인</button><button class="gray" id="x">닫기</button>';
  $("#adm").classList.add("on");
  $("#x").onclick=closeAdmin;
  $("#ok").onclick=()=>{if($("#pin").value===PIN)adminPanel();else $("#err").textContent="비밀번호가 달라요"};
}
function closeAdmin(){$("#adm").classList.remove("on")}
function adminPanel(){
  const cnt=[0,0,0,0,0,0];S.board.forEach((t,i)=>{if(!S.open[i])cnt[t]++});
  const left=cnt.reduce((a,b)=>a+b,0);
  let rows="";for(let t=1;t<=5;t++)rows+=`<tr><td>${t}등 ${NAME[t]}</td><td>${TOT[t]}</td><td>${cnt[t]}</td></tr>`;
  $("#box").innerHTML=`<h3>관리자</h3>
  <div>${S.round}회차 · 남은 칸 ${left} / ${SIZE}</div>
  <table><tr><th></th><th>총 수량</th><th>남은 수량</th></tr>${rows}</table>
  <div style="font-size:15px;opacity:.8">전체 초기화: 룰렛 ${SIZE}칸과 경품이 모두 처음 상태로 돌아가요. 한 타임이 끝나고 다음 타임에 쓸 때 눌러 주세요.</div>
  <button class="warn" id="all">전체 초기화 (새 타임 시작)</button><button class="gray" id="x">닫기</button>`;
  $("#x").onclick=closeAdmin;
  arm($("#all"),"전체 초기화 (새 타임 시작)",()=>{newSession();closeAdmin()});
}
function arm(btn,label,fn){
  let t;btn.onclick=()=>{
    if(btn.classList.contains("armed")){clearTimeout(t);fn();return}
    btn.classList.add("armed");btn.textContent="정말요? 한 번 더 누르세요";
    t=setTimeout(()=>{btn.classList.remove("armed");btn.textContent=label},3000)};
}

load();render();
</script>
</body>
</html>
